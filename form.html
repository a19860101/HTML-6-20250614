<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 表單 -->
    <form action="" method="get">
        <!-- 
            method 傳送方法:post get 
            action 傳送頁面
        -->
        <div>
            <label for="user">帳號</label>
            <input type="text" id="user" name="user">
        </div>
        <div>
            <label for="pw">密碼</label>
            <input type="password" id="pw" name="pw">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
        </div>
        <div>
            <label for="birth">出生年月日</label>
            <input type="date" id="birth" name="birth">
        </div>
        <div>
            <label for="qty">數量</label>
            <input type="number" id="qty" name="qty">
        </div>
        <div>
            <input type="datetime-local">
        </div>
        <div>
            <input type="range">
        </div>
        <div>
            <input type="color">
        </div>
        <div>
            <label for="edu">學歷</label>
            <select name="edu" id="edu">
                <option value="國小">國小</option>
                <option value="國中">國中</option>
                <option value="高中職">高中職</option>
                <option value="大專院校">大專院校</option>
                <option value="研究所以上">研究所以上</option>
            </select>
        </div>
        <div>
            <label for="gender">性別</label>

            <input type="radio" id="male" name="gender" value="男">
            <label for="male">男</label>

            <input type="radio" id="female" name="gender" value="女">
            <label for="female">女</label>

            <input type="radio" id="unknown" name="gender" value="不透露">
            <label for="unknown">不透露</label>
        </div>
        <div>
            <label for="knows">從何得知</label>

            <input type="checkbox" id="news" name="news" value="新聞">
            <label for="news">新聞</label>

            <input type="checkbox" id="sns" name="sns" value="社群媒體">
            <label for="sns">社群媒體</label>

            <input type="checkbox" id="friends" name="friends" value="朋友告知">
            <label for="friends">朋友告知</label>
        </div>
        <div>
            <label for="content">內容</label>
            <textarea name="content" id="content" rows="10" cols="50"></textarea>
        </div>
        <div>
            <input type="submit" value="送出">
            <input type="reset" value="清除">
            <input type="button" value="自定義">
        </div>
        <div>
            <button type="submit">送出</button>
            <button type="reset">清除</button>
            <button type="button">自定義</button>
        </div>
    </form>
    
    
</body>
</html>
